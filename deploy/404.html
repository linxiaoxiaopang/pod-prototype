<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面不存在 · POD 供应商目录</title>
    <style>
      :root {
        --ink: #0d1030;
        --muted: #858aa3;
        --primary: #5b4bff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: var(--ink);
        background: radial-gradient(900px 520px at 20% -10%, rgba(91, 75, 255, 0.14), transparent 60%),
          #f6f7fd;
      }

      .box {
        max-width: 460px;
        text-align: center;
      }

      .code {
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--primary);
        line-height: 1;
      }

      h1 {
        margin: 14px 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        font-size: 14.5px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="code">404</div>
      <h1>页面走丢了</h1>
      <p>该路径不存在，可能链接已变更。回到首页选择业务端或运营后台入口。</p>
      <a id="home" href="/">返回首页</a>
    </div>
    <script>
      // 兼容项目页（/repo-name/）与用户页（/）两种部署路径
      var segments = location.pathname.split('/').filter(Boolean)
      var home = segments.length > 1 ? '/' + segments[0] + '/' : '/'
      var link = document.getElementById('home')
      link.setAttribute('href', home)
    </script>
  </body>
</html>
