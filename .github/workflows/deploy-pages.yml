name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - master
      - dev-v1.0.0
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web

      - name: Build admin app
        run: npm run build:admin

      - name: Assemble site
        run: |
          set -eu
          mkdir -p site/web site/admin
          cp deploy/index.html site/index.html
          cp -r apps/web/dist/. site/web/
          cp -r apps/admin/dist/. site/admin/
          cp deploy/404.html site/404.html
          touch site/.nojekyll
          find site -maxdepth 2 -type d

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时自动为仓库创建 Pages 站点（需仓库管理员权限）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 仓库的 Pages 也可能在按分支构建（会把仓库根目录的 README 渲染成首页）。
      # 同一提交下两个发布任务会互相覆盖，谁后完成谁生效；这里先等分支构建结束，
      # 保证 Actions 产物最后发布。若 Pages 已切换为 GitHub Actions，则本步骤很快跳过。
      - name: Wait for branch Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 150))
          while [ $SECONDS -lt $deadline ]; do
            status=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status' \
              2>/dev/null || echo "")
            echo "branch pages build status: ${status:-none}"

            if [ "$status" = "completed" ]; then
              break
            fi

            # 分支构建尚未创建时给 30 秒宽限期，避免提前放行被后来的构建覆盖
            if [ -z "$status" ] || [ "$status" = "null" ]; then
              if [ $SECONDS -gt 30 ]; then
                break
              fi
            fi

            sleep 5
          done
          # 留出一点时间让分支构建的发布请求落盘
          sleep 10
          echo "proceeding to deploy Actions artifact"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
